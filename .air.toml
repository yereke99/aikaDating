root = "."
tmp_dir = ".tmp"

[build]
cmd = "npm --prefix web run build && go build -o ./.tmp/aikabot ./cmd"
entrypoint = ["./.tmp/aikabot"]
include_ext = ["go", "html", "css", "ts", "tsx", "json", "sql"]
exclude_dir = [".git", ".tools", ".tmp", "data", "profile_photo", "web/dist", "web/node_modules"]
exclude_regex = ["_test\\.go$"]
delay = 500
stop_on_error = true
send_interrupt = true
kill_delay = "1s"

[log]
time = true

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = false
keep_scroll = true
